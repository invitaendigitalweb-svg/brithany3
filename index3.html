
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Confirmación de asistencia</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
</script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #fff9fa 0%,
      #fcecef 45%,
      #f7dfe5 100%
    );

  font-family:
    'Montserrat',
    sans-serif;

  color: #5d424a;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 25px 15px;

}


.contenedor {

  width: 100%;

  max-width: 520px;

}


.tarjeta {

  background:
    rgba(255,255,255,.92);

  border:
    1px solid #d5ad65;

  border-radius:
    25px;

  padding:
    35px 28px;

  box-shadow:
    0 15px 45px
    rgba(128,72,89,.15);

}


.titulo {

  text-align: center;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 42px;

  color: #a77b2f;

  margin:
    0 0 8px;

}


.subtitulo {

  text-align: center;

  font-size: 13px;

  color: #80616a;

  margin-bottom: 30px;

}


.separador {

  width: 70px;

  height: 1px;

  background: #caa35b;

  margin:
    12px auto 28px;

}


.grupo {

  margin-bottom: 24px;

}


.etiqueta {

  display: block;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 22px;

  color: #9c6d28;

  margin-bottom: 9px;

}


input[type="text"] {

  width: 100%;

  padding:
    14px 15px;

  border-radius:
    12px;

  border:
    1px solid #e0bdc7;

  background:
    #fffafb;

  outline: none;

  font-family:
    'Montserrat',
    sans-serif;

  color:
    #5d424a;

  font-size:
    14px;

}


input[type="text"]:focus {

  border-color:
    #c9a154;

  box-shadow:
    0 0 0 3px
    rgba(201,161,84,.12);

}


input[type="text"].error {

  border-color:
    #c86d7b;

  box-shadow:
    0 0 0 3px
    rgba(200,109,123,.10);

}


.ayuda {

  font-size:
    11px;

  color:
    #947b82;

  margin-top:
    6px;

  line-height:
    1.4;

}


.error-texto {

  display: none;

  font-size:
    11px;

  color:
    #b45b68;

  margin-top:
    6px;

  line-height:
    1.4;

}


.error-texto.visible {

  display: block;

}


.opciones {

  display: flex;

  gap: 12px;

}


.opcion {

  flex: 1;

}


.opcion input {

  display: none;

}


.opcion label {

  display: block;

  text-align: center;

  padding:
    13px 8px;

  border:
    1px solid #e0bdc7;

  border-radius:
    12px;

  cursor: pointer;

  font-size:
    13px;

  background:
    #fffafb;

  transition:
    .2s;

}


.opcion input:checked + label {

  background:
    #f2d5dc;

  border-color:
    #bd8d3e;

  color:
    #815d20;

  font-weight:
    600;

}


.boton {

  width: 100%;

  border: 0;

  border-radius:
    30px;

  padding:
    16px;

  background:
    linear-gradient(
      135deg,
      #c49a4d,
      #e0bd70,
      #b98536
    );

  color:
    white;

  font-family:
    'Montserrat',
    sans-serif;

  font-size:
    14px;

  font-weight:
    600;

  cursor:
    pointer;

  box-shadow:
    0 8px 20px
    rgba(174,126,48,.25);

  transition:
    .2s;

}


.boton:hover {

  transform:
    translateY(-1px);

}


.boton:disabled {

  opacity:
    .6;

  cursor:
    wait;

}


.mensaje {

  display: none;

  text-align: center;

  margin-top:
    25px;

  padding:
    18px;

  border-radius:
    15px;

  background:
    #fff6f8;

  border:
    1px solid #e5c3ca;

  line-height:
    1.6;

  font-size:
    14px;

}


.mensaje.visible {

  display: block;

}


.pase-contenedor {

  display: none;

  margin-top:
    30px;

}


.pase-contenedor.visible {

  display: block;

}


.pase {

  background:
    linear-gradient(
      135deg,
      #fffafb,
      #fdf0f3
    );

  border:
    2px solid #c9a154;

  border-radius:
    22px;

  padding:
    30px 22px;

  text-align:
    center;

  position:
    relative;

  overflow:
    hidden;

}


.pase::before,
.pase::after {

  content: "";

  position:
    absolute;

  width:
    100px;

  height:
    100px;

  border:
    1px solid
    rgba(201,161,84,.25);

  border-radius:
    50%;

}


.pase::before {

  top:
    -60px;

  left:
    -50px;

}


.pase::after {

  bottom:
    -60px;

  right:
    -50px;

}


.pase-titulo {

  font-family:
    'Cormorant Garamond',
    serif;

  color:
    #a77b2f;

  font-size:
    35px;

  margin-bottom:
    5px;

}


.pase-linea {

  width:
    55px;

  height:
    1px;

  background:
    #c9a154;

  margin:
    12px auto 20px;

}


.pase-nombres {

  font-family:
    'Cormorant Garamond',
    serif;

  font-size:
    25px;

  line-height:
    1.25;

  color:
    #66434d;

  margin-bottom:
    18px;

}


.pase-cantidad {

  font-size:
    13px;

  text-transform:
    uppercase;

  letter-spacing:
    2px;

  color:
    #98723a;

  margin-bottom:
    15px;

}


.codigo {

  display:
    inline-block;

  font-family:
    'Montserrat',
    sans-serif;

  font-size:
    28px;

  font-weight:
    600;

  letter-spacing:
    7px;

  color:
    #9c6d28;

  padding:
    9px 16px;

  border-top:
    1px solid #d4b477;

  border-bottom:
    1px solid #d4b477;

}


.botones-pase {

  display:
    flex;

  gap:
    10px;

  margin-top:
    15px;

}


.boton-secundario {

  flex:
    1;

  padding:
    13px;

  border-radius:
    25px;

  border:
    1px solid #c9a154;

  background:
    #fff;

  color:
    #90682b;

  cursor:
    pointer;

  font-family:
    'Montserrat',
    sans-serif;

  font-size:
    12px;

}


@media(max-width:450px) {

  .tarjeta {

    padding:
      28px 20px;

  }


  .titulo {

    font-size:
      37px;

  }


  .pase-nombres {

    font-size:
      22px;

  }

}

</style>

</head>


<body>


<div class="contenedor">


<div class="tarjeta">


<h1 class="titulo">
  Confirmación
</h1>


<div class="subtitulo">

</div>


<div class="separador"></div>


<form id="formulario">


<!-- =========================================

========================================= -->

<div class="grupo">

<!-- =========================================

<div class="grupo">

<div class="opcion">

<input
  type="radio"
  name="asistencia2"

  value="SI"

  Sí asistiré

<div class="opcion">

>

<!-- =========================================

========================================= -->

<div class="grupo">

<input

</div>


<!-- =========================================
     ASISTENCIA 3
========================================= -->

<div class="grupo">

<label class="etiqueta">
  Asistencia
</label>


<div class="opciones">


<div class="opcion">

<input
  type="radio"

>

<script>


// ======================================================
// URL DE TU WEB APP
// ======================================================

const API_URL =
'https://script.google.com/macros/s/AKfycbylTcH2HuumxZuqGPFhWKhQwpmZrK8vqNxc4x87lxO2RsUh8BKSnLGEH2TPODx5_hdc/exec';


// ======================================================
// JSONP
// ======================================================

function llamarAPI(parametros) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'respuesta_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 10000
        );


      const script =
        document.createElement('script');


      const query =
        new URLSearchParams({

          ...parametros,

          callback:
            callbackName

        });


      const tiempoLimite =
        setTimeout(() => {

          limpiar();

          reject(
            new Error(
              'La solicitud tardó demasiado.'
            )
          );

        }, 15000);


      window[callbackName] =
        function(data) {

          clearTimeout(
            tiempoLimite
          );

          limpiar();

          resolve(data);

        };


      function limpiar() {

        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(script);

        }

      }


      script.onerror =
        function() {

          clearTimeout(
            tiempoLimite
          );

          limpiar();


          reject(
            new Error(
              'No fue posible conectar con el servidor.'
            )
          );

        };


      script.src =
        API_URL +
        '?' +
        query.toString();


      document.body
        .appendChild(script);

    }
  );

}


// ======================================================
// VALIDAR NOMBRE COMPLETO
// ======================================================

function validarNombreCompleto(nombre) {

  const partes =
    nombre
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  return partes.length >= 3;

}


// ======================================================
// MOSTRAR ERROR
// ======================================================

function mostrarErrorNombre(
  input,
  elemento,
  texto
) {

  input.classList.add('error');

  elemento.textContent =
    texto;

  elemento.classList.add(
    'visible'
  );

}


// ======================================================
// QUITAR ERROR
// ======================================================

function quitarErrorNombre(
  input,
  elemento
) {

  input.classList.remove(
    'error'
  );

  elemento.textContent =
    '';

  elemento.classList.remove(
    'visible'
  );

}


// ======================================================
// VALIDAR FORMULARIO
// ======================================================

function validarFormulario() {

  const invitado1 =
    document
      .getElementById(
        'invitado1'
      )
      .value
      .trim();


  const invitado2 =
    document
      .getElementById(
        'invitado2'
      )
      .value
      .trim();


  const invitado3 =
    document
      .getElementById(
        'invitado3'
      )
      .value
      .trim();


  const error1 =
    document.getElementById(
      'errorInvitado1'
    );


  const error2 =
    document.getElementById(
      'errorInvitado2'
    );


  const error3 =
    document.getElementById(
      'errorInvitado3'
    );


  const input1 =
    document.getElementById(
      'invitado1'
    );


  const input2 =
    document.getElementById(
      'invitado2'
    );


  const input3 =
    document.getElementById(
      'invitado3'
    );


  let valido = true;


  // ------------------------------------------
  // INVITADO 1
  // ------------------------------------------

  if (
    !validarNombreCompleto(
      invitado1
    )
  ) {

    mostrarErrorNombre(
      input1,
      error1,
      'Es obligatorio escribir el nombre y los dos apellidos.'
    );

    valido = false;

  } else {

    quitarErrorNombre(
      input1,
      error1
    );

  }


  // ------------------------------------------
  // INVITADO 2
  // ------------------------------------------

  if (
    invitado2 &&
    !validarNombreCompleto(
      invitado2
    )
  ) {

    mostrarErrorNombre(
      input2,
      error2,
      'Si agregas un invitado, debes escribir su nombre y sus dos apellidos.'
    );

    valido = false;

  } else {

    quitarErrorNombre(
      input2,
      error2
    );

  }


  // ------------------------------------------
  // INVITADO 3
  // ------------------------------------------

  if (
    invitado3 &&
    !validarNombreCompleto(
      invitado3
    )
  ) {

    mostrarErrorNombre(
      input3,
      error3,
      'Si agregas un invitado, debes escribir su nombre y sus dos apellidos.'
    );

    valido = false;

  } else {

    quitarErrorNombre(
      input3,
      error3
    );

  }


  return valido;

}


// ======================================================
// FORMULARIO
// ======================================================

document
  .getElementById('formulario')
  .addEventListener(
    'submit',
    async function(e) {

      e.preventDefault();


      // ------------------------------------------
      // VALIDACIÓN
      // ------------------------------------------

      if (
        !validarFormulario()
      ) {

        const primerError =
          document.querySelector(
            '.error'
          );


        if (primerError) {

          primerError.focus();

        }


        return;

      }


      const boton =
        document.getElementById(
          'botonEnviar'
        );


      boton.disabled = true;

      boton.textContent =
        'Enviando...';


      const invitado1 =
        document
          .getElementById(
            'invitado1'
          )
          .value
          .trim();


      const invitado2 =
        document
          .getElementById(
            'invitado2'
          )
          .value
          .trim();


      const invitado3 =
        document
          .getElementById(
            'invitado3'
          )
          .value
          .trim();


      const asistencia1 =
        document
          .querySelector(
            'input[name="asistencia1"]:checked'
          )
          ?.value || '';


      const asistencia2Elemento =
        document
          .querySelector(
            'input[name="asistencia2"]:checked'
          );


      const asistencia3Elemento =
        document
          .querySelector(
            'input[name="asistencia3"]:checked'
          );


      const asistencia2 =
        asistencia2Elemento
          ? asistencia2Elemento.value
          : '';


      const asistencia3 =
        asistencia3Elemento
          ? asistencia3Elemento.value
          : '';


      // ------------------------------------------
      // VALIDAR ASISTENCIA 2
      // ------------------------------------------

      if (
        invitado2 &&
        !asistencia2
      ) {

        mostrarMensaje(
          'Selecciona la asistencia del invitado 2.',
          false
        );


        boton.disabled = false;

        boton.textContent =
          'Enviar confirmación';


        return;

      }


      // ------------------------------------------
      // VALIDAR ASISTENCIA 3
      // ------------------------------------------

      if (
        invitado3 &&
        !asistencia3
      ) {

        mostrarMensaje(
          'Selecciona la asistencia del invitado 3.',
          false
        );


        boton.disabled = false;

        boton.textContent =
          'Enviar confirmación';


        return;

      }


      // ------------------------------------------
      // EVITAR INVITADO 3 SIN INVITADO 2
      // ------------------------------------------

      if (
        invitado3 &&
        !invitado2
      ) {

        mostrarMensaje(
          'Para agregar un invitado 3, primero debes escribir el invitado 2.',
          false
        );


        boton.disabled = false;

        boton.textContent =
          'Enviar confirmación';


        return;

      }


      try {

        const respuesta =
          await llamarAPI({

            accion:
              'confirmar',

            invitado1:
              invitado1,

            asistencia1:
              asistencia1,

            invitado2:
              invitado2,

            asistencia2:
              asistencia2,

            invitado3:
              invitado3,

            asistencia3:
              asistencia3

          });


        // --------------------------------------
        // ERROR
        // --------------------------------------

        if (
          !respuesta.ok
        ) {

          mostrarMensaje(
            respuesta.mensaje,
            false
          );


          return;

        }


        // --------------------------------------
        // NADIE ASISTE
        // --------------------------------------

        if (
          respuesta.pases === 0
        ) {

          mostrarMensaje(
            respuesta.mensaje,
            true
          );


          document
            .getElementById(
              'paseContenedor'
            )
            .classList
            .remove(
              'visible'
            );


          return;

        }


        // --------------------------------------
        // MOSTRAR MENSAJE
        // --------------------------------------

        mostrarMensaje(
          respuesta.mensaje,
          true
        );


        // --------------------------------------
        // CREAR NOMBRES DEL PASE
        // --------------------------------------

        let nombres = '';


        // INVITADO 1

        if (
          respuesta.asistencia1 ===
          'SI'
        ) {

          nombres +=
            escaparHTML(
              respuesta.invitado1
            );

        }


        // INVITADO 2

        if (
          respuesta.invitado2 &&
          respuesta.asistencia2 ===
          'SI'
        ) {

          if (nombres) {

            nombres +=
              '<br>';

          }


          nombres +=
            escaparHTML(
              respuesta.invitado2
            );

        }


        // INVITADO 3

        if (
          respuesta.invitado3 &&
          respuesta.asistencia3 ===
          'SI'
        ) {

          if (nombres) {

            nombres +=
              '<br>';

          }


          nombres +=
            escaparHTML(
              respuesta.invitado3
            );

        }


        document
          .getElementById(
            'paseNombres'
          )
          .innerHTML =
          nombres;


        // --------------------------------------
        // CANTIDAD DE PASES
        // --------------------------------------

        document
          .getElementById(
            'paseCantidad'
          )
          .textContent =
          respuesta.pases +
          (
            respuesta.pases === 1
              ? ' pase'
              : ' pases'
          );


        // --------------------------------------
        // CÓDIGO
        // --------------------------------------

        document
          .getElementById(
            'paseCodigo'
          )
          .textContent =
          respuesta.codigo;


        // --------------------------------------
        // MOSTRAR PASE
        // --------------------------------------

        document
          .getElementById(
            'paseContenedor'
          )
          .classList
          .add(
            'visible'
          );


        document
          .getElementById(
            'paseContenedor'
          )
          .scrollIntoView({

            behavior:
              'smooth',

            block:
              'center'

          });


      }

      catch(error) {

        mostrarMensaje(
          'No pudimos enviar la confirmación. Intenta nuevamente.',
          false
        );

      }

      finally {

        boton.disabled =
          false;

        boton.textContent =
          'Enviar confirmación';

      }

    }
  );


// ======================================================
// MOSTRAR MENSAJE
// ======================================================

function mostrarMensaje(
  texto,
  correcto
) {

  const mensaje =
    document.getElementById(
      'mensaje'
    );


  mensaje.innerHTML =
    escaparHTML(
      texto
    );


  mensaje.classList.add(
    'visible'
  );

}


// ======================================================
// ESCAPAR HTML
// ======================================================

function escaparHTML(
  texto
) {

  return String(texto)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


// ======================================================
// DESCARGAR PASE
// ======================================================

async function descargarPase() {

  const pase =
    document.getElementById(
      'pase'
    );


  const canvas =
    await html2canvas(
      pase,
      {

        scale: 3,

        backgroundColor:
          '#fffafb',

        useCORS:
          true

      }
    );


  const enlace =
    document.createElement(
      'a'
    );


  const codigo =
    document
      .getElementById(
        'paseCodigo'
      )
      .textContent;


  enlace.download =
    'Pase-' +
    codigo +
    '.png';


  enlace.href =
    canvas.toDataURL(
      'image/png'
    );


  enlace.click();

}


// ======================================================
// CAMBIAR ASISTENCIA
// ======================================================

function volverEditar() {

  document
    .getElementById(
      'paseContenedor'
    )
    .classList
    .remove(
      'visible'
    );


  document
    .getElementById(
      'mensaje'
    )
    .classList
    .remove(
      'visible'
    );


  window.scrollTo({

    top: 0,

    behavior:
      'smooth'

  });

}

</script>
